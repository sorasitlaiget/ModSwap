name: flutter_project
description: "ModSwap - KMUTT Marketplace"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter


  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.0
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  url_launcher: ^6.3.0

  # State management
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.0

  # Biometric auth
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Image handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  build_runner: ^2.4.11
  custom_lint: ^0.6.4

flutter:
  uses-material-design: true
  assets:
    - images/ModSwap.png
    - images/ModFont.png
    - images/KMUTT_Logo.png
  